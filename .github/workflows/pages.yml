name: pages

# Deploy the landing page in site/ to GitHub Pages on every push to main.
# To activate: GitHub repo > Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r site/* _site/
          # When you buy agentguard.space:
          #   1. rename site/CNAME.disabled to site/CNAME
          #   2. add a CNAME DNS record pointing to nikegunn.github.io
          #   3. push - this step picks it up automatically.
          if [ -f _site/CNAME.disabled ]; then rm _site/CNAME.disabled; fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
