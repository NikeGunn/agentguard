name: bench

# Run the performance benchmark suite. Manual trigger only - bench
# results vary with runner load, so we don't run on every push.

on:
  workflow_dispatch:
  schedule:
    # Weekly trend baseline, Mondays 04:00 UTC.
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
      - name: Run benchmarks
        run: go test -bench=. -benchmem -run='^$' -timeout 10m ./bench/... | tee bench.txt
      - name: P99 gate
        run: go test -run TestCheapPathP99 -timeout 5m ./bench/...
      - uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: bench.txt
